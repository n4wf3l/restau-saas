name: Deploy tenant vitrine to GitHub Pages

# Static frontend-only build of a single tenant's public site (see CLAUDE.md §10b).
# No backend is deployed — reads frozen JSON from frontend/public/static-tenant/<slug>/
# that a developer refreshes locally via `php artisan tenant:export-static <slug>`.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-vitrine.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TENANT_SLUG: rr-ice
  PAGES_BASE: /restau-saas/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build vitrine
        env:
          VITE_STATIC_TENANT: ${{ env.TENANT_SLUG }}
          VITE_STATIC_BASE: ${{ env.PAGES_BASE }}
        run: npm run build:vitrine

      - name: SPA fallback for GH Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
