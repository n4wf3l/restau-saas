<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1410" />

    <!-- Default SaaS meta — react-helmet-async overrides these on tenant pages (/r/:slug/*)
         and on the marketing landing (/) via <SaasSEO /> / <TenantSEO />. -->
    <title>NA Innovations — Solution complète pour restaurants</title>
    <meta name="description" content="La plateforme sur-mesure pour restaurants : réservations en ligne, gestion de menu, site web professionnel. Développé au Maroc." />
    <meta name="author" content="NA Innovations" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph fallback (per-page overrides via Helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NA Innovations" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Lora:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Runs before React mounts. On /r/:slug pages, do two things from localStorage cache:
      //   1. Apply the tenant's theme (data-theme on <html>) so first paint uses the right palette.
      //   2. Preload the first hero image so it can start downloading immediately.
      // Cache is written by PublicSettingsContext/SiteImagesContext (stale-while-revalidate),
      // so this stays in sync with whatever the admin last set in the dashboard.
      (function () {
        try {
          var m = location.pathname.match(/^\/r\/([^/]+)/);
          if (!m) return;
          var slug = m[1];

          // Theme
          var settingsRaw = localStorage.getItem('publicSettings:' + slug);
          if (settingsRaw) {
            var settings = JSON.parse(settingsRaw);
            if (settings && settings.theme) {
              document.documentElement.setAttribute('data-theme', settings.theme);
            }
          }

          // Hero image preload
          var imagesRaw = localStorage.getItem('siteImages:' + slug);
          if (!imagesRaw) return;
          var data = JSON.parse(imagesRaw);
          var url = data && data.hero && data.hero[0] && data.hero[0].image_url;
          if (!url) return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = url;
          link.fetchPriority = 'high';
          document.head.appendChild(link);
        } catch (e) { /* corrupt cache or storage disabled — ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
